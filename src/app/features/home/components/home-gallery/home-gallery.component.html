<section
  #gallerySection
  class="gallery"
  [class.gallery--visible]="isVisible()"
  aria-labelledby="home-gallery-title"
>
  <div class="gallery__shell">
    <header class="gallery__header">
      <p class="gallery__eyebrow">{{ content().eyebrow }}</p>
      <h2 id="home-gallery-title" class="gallery__title">{{ content().title }}</h2>
    </header>

    <div class="gallery__tabs-shell">
      <p class="gallery__tabs-label">Selecciona una galeria</p>
      <div class="gallery__tabs" role="tablist" aria-label="Selector de galerias editoriales">
        @for (category of content().categories; track category.slug; let index = $index) {
          <button
            type="button"
            class="gallery__tab"
            [class.gallery__tab--active]="index === activeCategoryIndex()"
            [attr.aria-selected]="index === activeCategoryIndex()"
            (click)="selectCategory(index)"
          >
            <span class="gallery__tab-copy">
              <span class="gallery__tab-index">Serie {{ index + 1 < 10 ? '0' + (index + 1) : index + 1 }}</span>
              <span class="gallery__tab-name">{{ category.label }}</span>
              <span class="gallery__tab-hint">{{ index === activeCategoryIndex() ? 'Galeria activa' : 'Abrir galeria' }}</span>
            </span>
            <img
              class="gallery__tab-icon"
              [src]="'/iconos/galeria' + (index + 1) + '.png'"
              [alt]="'Icono de ' + category.label"
            />
          </button>
        }
      </div>
    </div>

    <section
      class="gallery__stage"
      [class.gallery__stage--inverted]="activeCategory().inverted"
      [attr.aria-label]="activeCategory().label"
    >
      <div class="gallery__artboard">
        <svg
          class="gallery__glass gallery__glass--normal"
          viewBox="95 74.01 1397 970.4300000000001"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path
            d="M115 84.01 L739 84.01 C739 84.01, 749 84.01, 749 94.01 L749 109.45 C749 109.45, 749 119.45, 759 119.45 L921.775 119.45 C921.775 119.45, 922 119.45, 922 119.67500000000001 L922 119.67500000000001 C922 119.67500000000001, 922 119.9, 922.225 119.9 L1472 119.9 C1472 119.9, 1482 119.9, 1482 129.9 L1482 987.0999999999999 C1482 987.0999999999999, 1482 997.0999999999999, 1472 997.0999999999999 L1301 997.0999999999999 C1301 997.0999999999999, 1300 997.0999999999999, 1300 998.0999999999999 L1300 998.0999999999999 C1300 998.0999999999999, 1300 999.0999999999999, 1299 999.0999999999999 L921.2250000000001 999.0999999999999 C921.2250000000001 999.0999999999999, 921 999.0999999999999, 921 999.325 L921 999.325 C921 999.325, 921 999.5500000000001, 920.7749999999999 999.5500000000001 L753.61 999.5500000000001 C753.61 999.5500000000001, 743.61 999.5500000000001, 743.61 1009.5500000000001 L743.61 1024.44 C743.61 1024.44, 743.61 1034.44, 733.61 1034.44 L120 1034.44 C120 1034.44, 110 1034.44, 110 1024.44 L110 967.56 C110 967.56, 110 957.56, 120 957.56 L711 957.56 C711 957.56, 721 957.56, 721 947.56 L721 800.95 C721 800.95, 721 800.45, 721.5 800.45 L721.5 800.45 C721.5 800.45, 722 800.45, 722 799.95 L722 169.99 C722 169.99, 722 159.99, 712 159.99 L115 159.99 C115 159.99, 105 159.99, 105 149.99 L105 94.01 C105 94.01, 105 84.01, 115 84.01"
          />
        </svg>

        <svg
          class="gallery__glass gallery__glass--inverted"
          viewBox="95 74.01 1397 970.4300000000001"
          preserveAspectRatio="none"
          aria-hidden="true"
        >
          <path
            d="M115 84.01 L739 84.01 C739 84.01, 749 84.01, 749 94.01 L749 109.45 C749 109.45, 749 119.45, 759 119.45 L921.775 119.45 C921.775 119.45, 922 119.45, 922 119.67500000000001 L922 119.67500000000001 C922 119.67500000000001, 922 119.9, 922.225 119.9 L1472 119.9 C1472 119.9, 1482 119.9, 1482 129.9 L1482 987.0999999999999 C1482 987.0999999999999, 1482 997.0999999999999, 1472 997.0999999999999 L1301 997.0999999999999 C1301 997.0999999999999, 1300 997.0999999999999, 1300 998.0999999999999 L1300 998.0999999999999 C1300 998.0999999999999, 1300 999.0999999999999, 1299 999.0999999999999 L921.2250000000001 999.0999999999999 C921.2250000000001 999.0999999999999, 921 999.0999999999999, 921 999.325 L921 999.325 C921 999.325, 921 999.5500000000001, 920.7749999999999 999.5500000000001 L753.61 999.5500000000001 C753.61 999.5500000000001, 743.61 999.5500000000001, 743.61 1009.5500000000001 L743.61 1024.44 C743.61 1024.44, 743.61 1034.44, 733.61 1034.44 L120 1034.44 C120 1034.44, 110 1034.44, 110 1024.44 L110 967.56 C110 967.56, 110 957.56, 120 957.56 L711 957.56 C711 957.56, 721 957.56, 721 947.56 L721 800.95 C721 800.95, 721 800.45, 721.5 800.45 L721.5 800.45 C721.5 800.45, 722 800.45, 722 799.95 L722 169.99 C722 169.99, 722 159.99, 712 159.99 L115 159.99 C115 159.99, 105 159.99, 105 149.99 L105 94.01 C105 94.01, 105 84.01, 115 84.01"
          />
        </svg>

        <p class="gallery__stage-eyebrow">{{ activeCategory().eyebrow }}</p>

        <figure
          #galleryFeature
          class="gallery__feature"
          [class.gallery__feature--highlighted]="featureHighlighted()"
          (click)="openViewer()"
        >
          <img
            class="gallery__feature-image"
            [src]="activeImage().src"
            [alt]="activeImage().alt"
          />

          <figcaption class="gallery__feature-copy">
            <h3 class="gallery__stage-title">{{ activeCategory().title }}</h3>
            <p class="gallery__stage-description">{{ activeCategory().description }}</p>
          </figcaption>
        </figure>

        <div class="gallery__thumbs" role="list" aria-label="Miniaturas de la categoria">
          @for (image of activeCategory().images; track image.src; let index = $index) {
            <button
              type="button"
              class="gallery__thumb"
              [class.gallery__thumb--active]="index === activeImageIndex()"
              (click)="selectImage(index)"
            >
              <span class="gallery__thumb-card">
                <span class="gallery__thumb-face gallery__thumb-face--front">
                  <img class="gallery__thumb-image" [src]="image.src" [alt]="image.alt" />
                </span>

                <span class="gallery__thumb-face gallery__thumb-face--back" aria-hidden="true">
                  <img class="gallery__thumb-image gallery__thumb-image--mirrored" [src]="image.src" alt="" />
                  <span class="gallery__thumb-overlay"></span>
                  <span class="gallery__thumb-meta">
                    <span class="gallery__thumb-status">{{ index === activeImageIndex() ? 'Seleccionada' : 'Ver' }}</span>
                    <span class="gallery__thumb-action">
                      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M12 5C6.5 5 2.08 8.44 1 12c1.08 3.56 5.5 7 11 7s9.92-3.44 11-7c-1.08-3.56-5.5-7-11-7Zm0 11.2A4.2 4.2 0 1 1 12 7.8a4.2 4.2 0 0 1 0 8.4Zm0-1.8a2.4 2.4 0 1 0 0-4.8 2.4 2.4 0 0 0 0 4.8Z"/>
                      </svg>
                      <span>{{ index === activeImageIndex() ? 'En curso' : 'Ver' }}</span>
                    </span>
                  </span>
                </span>
              </span>
            </button>
          }
        </div>
      </div>
    </section>
  </div>

  @if (isViewerOpen()) {
    <div class="gallery__viewer" role="dialog" aria-modal="true" [attr.aria-label]="activeImage().alt">
      <button type="button" class="gallery__viewer-backdrop" aria-label="Cerrar visor" (click)="closeViewer()"></button>
      <div class="gallery__viewer-panel">
        <button
          type="button"
          class="gallery__viewer-nav gallery__viewer-nav--prev"
          aria-label="Foto anterior"
          (click)="goToPreviousImage()"
        >
          <span aria-hidden="true">‹</span>
        </button>

        <button type="button" class="gallery__viewer-close" aria-label="Cerrar imagen" (click)="closeViewer()">
          <span aria-hidden="true">×</span>
        </button>

        <div
          class="gallery__viewer-stage"
          (pointerdown)="onViewerPointerDown($event)"
          (pointermove)="onViewerPointerMove($event)"
          (pointerup)="onViewerPointerUp($event)"
          (pointercancel)="onViewerPointerCancel($event)"
          (touchstart)="onViewerTouchStart($event)"
          (touchmove)="onViewerTouchMove($event)"
          (touchend)="onViewerTouchEnd($event)"
          (touchcancel)="onViewerTouchCancel()"
        >
          <img class="gallery__viewer-image" [src]="activeImage().src" [alt]="activeImage().alt" draggable="false" />
        </div>

        <button
          type="button"
          class="gallery__viewer-nav gallery__viewer-nav--next"
          aria-label="Foto siguiente"
          (click)="goToNextImage()"
        >
          <span aria-hidden="true">›</span>
        </button>
      </div>
    </div>
  }
</section>
