<section class="hero" aria-labelledby="home-hero-title">
  <span class="hero__back-word" aria-hidden="true">MODEL</span>

  <div class="hero__content">
    <div class="hero__copy">
      <p class="hero__eyebrow">{{ content().eyebrow }}</p>

      <h1 id="home-hero-title" class="hero__title">
        <span class="hero__title-line">{{ content().title }}</span>
        <span class="hero__title-line hero__title-line--delay">{{ content().highlight }}</span>
      </h1>

      <span class="hero__rule" aria-hidden="true"></span>

      <p class="hero__description">{{ content().description }}</p>

      <div class="hero__actions">
        <a class="hero__button hero__button--primary" [routerLink]="content().primaryCtaLink">
          {{ content().primaryCtaLabel }}
        </a>
        <a class="hero__button hero__button--secondary" [routerLink]="content().secondaryCtaLink">
          {{ content().secondaryCtaLabel }}
        </a>
      </div>

      <div class="hero__socials" aria-label="Redes y contacto">
        @for (item of content().socialLinks; track item.label; let last = $last) {
          <a class="hero__social-link" [href]="item.href">
            {{ item.label }}
          </a>
          @if (!last) {
            <span class="hero__social-divider" aria-hidden="true"></span>
          }
        }
      </div>
    </div>
  </div>
</section>
